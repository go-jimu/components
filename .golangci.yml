version: "2"

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - errorlint
    - gocritic
    - godot
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usetesting
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Tests write and read fixtures under t.TempDir.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
