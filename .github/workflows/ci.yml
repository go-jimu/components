name: CI
# A merged pull request is tested and released once, by the push to master it
# creates. Pull request runs test the change only.
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

# Tests read the repository only; auto_release alone pushes a tag.
permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Master runs
# queue one at a time, so two releases never pick the same tag; a queued run
# replaced by a newer one is released by that newer run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    runs-on: ${{matrix.os}}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go 1.x
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{matrix.go-version}}
          # Caching is done below: setup-go keys its cache on go.sum alone, so
          # the first build cache saved for a go.sum is reused, never refreshed.
          cache: false
      # Each master run saves a fresh build cache under its commit; every run
      # restores the newest one for its Go version and go.sum files.
      - name: Restore Go build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: Unittest
        run: make test
      # One iteration each: benchmarks still compile and run, while timings
      # from shared runners are not compared.
      - name: Benchmark smoke
        run: make benchmark extend=-benchtime=1x
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
      - name: Code Coverage Report
        if: ${{ matrix.go-version == '1.25.x' }}
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: coverage.txt
          flags: unittest
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
    strategy:
      fail-fast: true
      matrix:
        # 1.25 is the minimum go.mod requires.
        go-version: [1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest]
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: false
      # Bump the version here and in the Makefile together; .golangci.yml is
      # written for golangci-lint v2.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
  # Branch protection requires this job alone, so changing the Go matrix or
  # adding a job never leaves a pull request waiting on a renamed check. A
  # required check that is skipped counts as passed, so this job always runs
  # and fails unless every job it needs succeeded.
  ci-ok:
    if: ${{ always() }}
    needs: [unittest, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
  # Releases a merged pull request: autotag reads the source branch from the
  # merge commit message, so release/* bumps the minor version and any other
  # branch the patch version. Direct pushes to master are tested, not released.
  auto_release:
    needs: [unittest, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request ') }}
    steps:
    - name: Check out the merge commit
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Auto Tag
      id: autotag
      uses: jacexh/action-autotag@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch
    - name: Create GitHub Release
      if: ${{ steps.autotag.outputs.new_tag != '' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.autotag.outputs.new_tag }}
        name: ${{ steps.autotag.outputs.new_tag }}
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
